<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KingPilot 控制台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=17">
</head>
<body>
  <section id="login-layer" class="login-layer">
    <form id="login-form" class="login-card">
      <h1>KingPilot</h1>
      <p class="muted">企业级 ERP Agent 控制台</p>
      <label for="api-key">API Key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">进入控制台</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <main id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <strong>KingPilot</strong>
        <span class="muted">控制台</span>
      </div>
      <div class="topbar-actions">
        <span id="stream-state" class="stream-state" aria-live="polite"></span>
        <button
          id="approval-toggle"
          type="button"
          class="ghost"
          aria-expanded="false"
          aria-controls="approval-panel"
        >审批</button>
        <button
          id="trace-toggle"
          type="button"
          class="ghost"
          aria-expanded="false"
          aria-controls="trace-panel"
        >Trace</button>
        <div id="account-info" class="account-info" hidden>
          <span id="account-avatar" class="account-avatar" aria-hidden="true"></span>
          <span class="account-text">
            <strong id="account-name" class="account-name"></strong>
            <span id="account-role" class="account-role"></span>
          </span>
        </div>
        <button id="logout" type="button" class="ghost">登出</button>
      </div>
    </header>

    <aside class="sessions-panel">
      <div class="panel-header">
        <span>会话</span>
        <button id="new-session" type="button" class="ghost">＋ 新建</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </aside>

    <section class="chat-panel">
      <div id="phase-status" class="phase-status" aria-live="polite"></div>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea
          id="message-input"
          rows="2"
          placeholder="输入问题，Enter 发送，Shift+Enter 换行"
          aria-label="消息输入"
          required
        ></textarea>
        <button id="send-button" type="submit">发送</button>
      </form>
    </section>

    <div id="trace-backdrop" class="trace-backdrop" hidden></div>
    <aside id="trace-panel" class="trace-panel" aria-hidden="true" aria-label="Trace 面板">
      <div class="panel-header">
        <span>Trace</span>
        <div class="panel-actions">
          <button id="refresh-traces" type="button" class="ghost" aria-label="刷新 Trace">↻</button>
          <button id="close-traces" type="button" class="ghost" aria-label="关闭 Trace 面板">✕</button>
        </div>
      </div>
      <p id="trace-hint" class="trace-hint">点击列表中的 Trace 查看详情</p>
      <div id="trace-list" class="trace-list"></div>
      <section id="trace-detail" class="trace-detail" hidden>
        <div class="trace-detail-header">
          <span>详情</span>
          <button id="close-trace-detail" type="button" class="ghost">收起</button>
        </div>
        <pre id="trace-report" class="trace-report" aria-live="polite"></pre>
      </section>
    </aside>

    <div id="approval-backdrop" class="trace-backdrop" hidden></div>
    <aside id="approval-panel" class="trace-panel" aria-hidden="true" aria-label="审批面板">
      <div class="panel-header">
        <span>审批</span>
        <div class="panel-actions">
          <button id="refresh-approvals" type="button" class="ghost" aria-label="刷新审批">↻</button>
          <button id="close-approvals" type="button" class="ghost" aria-label="关闭审批面板">✕</button>
        </div>
      </div>
      <p class="trace-hint">待我审批的单据；发起人不能审批自己提交的申请。</p>
      <div id="approval-list" class="approval-list"></div>
    </aside>
  </main>

  <script src="./app.js?v=17" defer></script>
</body>
</html>
