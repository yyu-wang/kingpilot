<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KingPilot 控制台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <section id="login-layer" class="login-layer">
    <form id="login-form" class="login-card">
      <h1>KingPilot</h1>
      <p class="muted">企业级金蝶 ERP Agent 控制台</p>
      <label for="api-key">API Key</label>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" required>
      <button type="submit">进入控制台</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <main id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <strong>KingPilot</strong>
        <span class="muted">控制台</span>
      </div>
      <div class="topbar-actions">
        <span id="stream-state" class="muted" aria-live="polite"></span>
        <button id="logout" type="button" class="ghost">登出</button>
      </div>
    </header>

    <aside class="sessions-panel">
      <div class="panel-header">
        <span>会话</span>
        <button id="new-session" type="button" class="ghost">＋ 新建</button>
      </div>
      <div id="session-list" class="session-list"></div>
    </aside>

    <section class="chat-panel">
      <div id="phase-status" class="phase-status" aria-live="polite"></div>
      <div id="messages" class="messages"></div>
      <form id="composer" class="composer">
        <textarea
          id="message-input"
          rows="2"
          placeholder="输入问题，Enter 发送，Shift+Enter 换行"
          aria-label="消息输入"
          required
        ></textarea>
        <button id="send-button" type="submit">发送</button>
      </form>
    </section>

    <aside class="trace-panel">
      <div class="panel-header">
        <span>Trace</span>
        <button id="refresh-traces" type="button" class="ghost">↻</button>
      </div>
      <div id="trace-list" class="trace-list"></div>
      <pre id="trace-report" class="trace-report" aria-live="polite"></pre>
    </aside>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
